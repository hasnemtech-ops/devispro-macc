<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;width:1024px;height:1024px;overflow:hidden;background:transparent;}
  .canvas{
    width:1024px;height:1024px;background:transparent;
    display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  .wrap{display:flex;align-items:flex-start;}
  .co{
    font-weight:800;font-size:270px;color:#F5B93D;letter-spacing:-11px;line-height:1;
  }
  .otr{
    margin-top:44px;margin-left:4px;
    background:#F5B93D;color:#10233A;
    font-weight:800;font-size:48px;letter-spacing:1px;
    padding:5px 14px;border-radius:10px;
    text-transform:lowercase;
  }
</style></head>
<body>
<div class="canvas">
  <div class="wrap">
    <div class="co">CO</div>
    <div class="otr">otr</div>
  </div>
</div>
</body></html>
