<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;width:1024px;height:1024px;overflow:hidden;}
  .canvas{
    width:1024px;height:1024px;
    background:radial-gradient(circle at 30% 22%, #1B3A5C 0%, #10233A 62%);
    display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    position:relative;
  }
  .bar{
    position:absolute;left:0;right:0;bottom:0;height:16px;
    background:linear-gradient(90deg,#F5B93D,rgba(245,185,61,0) 88%);
  }
  .wrap{position:relative;display:flex;align-items:flex-start;}
  .co{
    font-weight:800;font-size:420px;color:#F5B93D;letter-spacing:-18px;line-height:1;
    text-shadow:0 8px 0 rgba(0,0,0,.15);
  }
  .otr{
    margin-top:70px;margin-left:6px;
    background:#F5B93D;color:#10233A;
    font-weight:800;font-size:76px;letter-spacing:2px;
    padding:8px 22px;border-radius:16px;
    text-transform:lowercase;
  }
</style></head>
<body>
<div class="canvas">
  <div class="wrap">
    <div class="co">CO</div>
    <div class="otr">otr</div>
  </div>
  <div class="bar"></div>
</div>
</body></html>
