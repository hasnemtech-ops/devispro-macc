<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;width:2732px;height:2732px;overflow:hidden;}
  .canvas{
    width:2732px;height:2732px;
    background:radial-gradient(circle at 32% 30%, #1B3A5C 0%, #10233A 60%);
    display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  .wrap{display:flex;align-items:flex-start;}
  .co{
    font-weight:800;font-size:340px;color:#F5B93D;letter-spacing:-14px;line-height:1;
  }
  .otr{
    margin-top:56px;margin-left:6px;
    background:#F5B93D;color:#10233A;
    font-weight:800;font-size:60px;letter-spacing:1px;
    padding:6px 18px;border-radius:14px;
    text-transform:lowercase;
  }
</style></head>
<body>
<div class="canvas">
  <div class="wrap">
    <div class="co">CO</div>
    <div class="otr">otr</div>
  </div>
</div>
</body></html>
