<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Devis Pro</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#10233A">
<style>
  :root{
    --navy:#10233A;
    --navy-2:#1B3A5C;
    --amber:#F5B93D;
    --amber-dark:#D99A1B;
    --bg:#F5F7FA;
    --surface:#FFFFFF;
    --text:#16212E;
    --muted:#5B6B7C;
    --success:#2E8B57;
    --danger:#C4432B;
    --border:#E1E5EA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:70px;
  }
  h1,h2,h3{font-family:inherit;letter-spacing:-0.01em;margin:0;}
  .app-header{
    background:var(--navy);
    color:#fff;
    padding:18px 16px 14px;
    position:sticky;top:0;z-index:20;
  }
  .app-header .brand{
    display:flex;align-items:center;gap:10px;
  }
  .bolt{width:22px;height:22px;flex:none;}
  .app-header h1{font-size:19px;font-weight:700;}
  .app-header .sub{font-size:12px;color:#B9C6D6;margin-top:2px;}
  .circuit-rule{
    height:2px;background:linear-gradient(90deg,var(--amber),transparent 85%);
    margin-top:12px;border-radius:2px;
  }
  nav.tabs{
    display:flex;background:var(--surface);border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:19;
  }
  nav.tabs button{
    flex:1;padding:12px 4px;border:none;background:none;font-size:13.5px;font-weight:600;
    color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;
  }
  nav.tabs button.active{color:var(--navy);border-bottom-color:var(--amber);}
  .ent-bar{display:none;align-items:center;gap:8px;padding:8px 16px;background:#EEF2F7;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--muted);}
  .ent-bar select{flex:1;min-width:0;padding:7px 8px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-weight:600;color:var(--navy);background:#fff;}
  main{padding:16px;max-width:720px;margin:0 auto;}
  /* Sur PC / grands écrans : le contenu occupe toute la largeur de la fenêtre */
  @media (min-width:900px){
    main{max-width:none;padding:20px 28px;}
  }
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:16px;margin-bottom:14px;
  }
  .card h2{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--navy-2);margin-bottom:12px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  input[type=text],input[type=number],input[type=email],input[type=tel],input[type=date],select,textarea{
    width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:8px;
    font-size:14.5px;background:#fff;color:var(--text);font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:0;border-color:var(--amber-dark);}
  textarea{resize:vertical;min-height:70px;}
  /* Champs numériques sans flèches haut/bas (Chrome, WebView Android, Electron, Safari, Firefox) */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:11px 16px;border-radius:9px;border:none;font-size:14px;font-weight:700;
    cursor:pointer;text-decoration:none;
  }
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:active{background:var(--navy-2);}
  .btn-amber{background:var(--amber);color:var(--navy);}
  .btn-amber:active{background:var(--amber-dark);}
  .btn-ghost{background:#fff;color:var(--navy);border:1px solid var(--border);}
  .btn-danger{background:#fff;color:var(--danger);border:1px solid #F0CFC7;}
  .btn-sm{padding:7px 10px;font-size:12.5px;border-radius:7px;}
  .btn-block{width:100%;}
  .actions-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .list-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 4px;border-bottom:1px solid var(--border);gap:10px;
  }
  .list-item:last-child{border-bottom:none;}
  .list-item .meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .list-item .name{font-weight:700;font-size:14.5px;}
  .pill{
    display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;
    background:#EAF1F8;color:var(--navy-2);
  }
  .pill.brouillon{background:#EFEFEF;color:#666;}
  .pill.envoye{background:#FFF3D9;color:#946A00;}
  .pill.accepte{background:#E4F3EA;color:var(--success);}
  .pill.refuse{background:#FBE7E2;color:var(--danger);}
  .empty-state{
    text-align:center;padding:40px 20px;color:var(--muted);
  }
  .empty-state .bolt{width:34px;height:34px;margin:0 auto 10px;opacity:.5;}
  .fab{
    position:fixed;bottom:22px;right:20px;
    width:56px;height:56px;border-radius:50%;
    background:var(--amber);color:var(--navy);border:none;
    font-size:28px;font-weight:400;box-shadow:0 6px 16px rgba(16,35,58,.25);
    cursor:pointer;z-index:25;line-height:1;
    align-items:center;justify-content:center;padding:0 0 3px;
  }
  .modal-overlay{
    position:fixed;inset:0;background:rgba(16,35,58,.5);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
  }
  .modal{
    background:#fff;width:100%;max-width:720px;border-radius:16px 16px 0 0;
    max-height:92vh;overflow-y:auto;padding:18px 16px 24px;
  }
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .modal-header h2{font-size:16px;color:var(--navy);}
  .close-x{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;padding:4px 8px;}
  .line-item{
    border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px;position:relative;
  }
  .line-item .row2{margin-bottom:8px;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:4px;border:1px solid var(--border);border-radius:10px;}
  table.lignes-table{width:100%;border-collapse:collapse;min-width:560px;}
  table.lignes-table th{
    background:var(--navy);color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.03em;
    text-align:left;padding:8px 8px;white-space:nowrap;
  }
  table.lignes-table th.col-num, table.lignes-table th.col-rm{text-align:right;}
  table.lignes-table td{padding:5px 6px;border-bottom:1px solid var(--border);vertical-align:middle;}
  table.lignes-table tbody tr:last-child td{border-bottom:none;}
  table.lignes-table tbody tr:nth-child(even){background:#FAFBFC;}
  table.lignes-table .col-desig{width:auto;min-width:180px;}
  table.lignes-table .col-num{width:110px;}
  table.lignes-table .col-rm{width:58px;white-space:nowrap;}
  table.lignes-table input{
    width:100%;padding:7px 8px;border:1px solid transparent;border-radius:6px;font-size:14px;
    background:transparent;text-align:left;
  }
  table.lignes-table td.col-num input{text-align:right;}
  table.lignes-table input:focus{background:#fff;border-color:var(--amber-dark);outline:none;}
  table.lignes-table .total-cell{text-align:right;font-weight:700;font-size:13.5px;color:var(--navy);white-space:nowrap;}
  table.lignes-table .remove-line{
    background:none;border:none;color:var(--danger);font-size:20px;line-height:1;font-weight:700;cursor:pointer;
    padding:4px 6px;
  }
  table.lignes-table .insert-line{
    background:none;border:none;color:var(--amber-dark);font-size:16px;line-height:1;font-weight:700;cursor:pointer;
    padding:4px 6px;
  }
  table.lignes-table td.col-rm{text-align:center;white-space:nowrap;font-size:0;}
  table.lignes-table tr[data-section] td.col-rm{background:#F5F7FA;}
  table.lignes-table td.col-rm button{
    display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;
    width:24px;height:30px;padding:0;margin:0;
  }
  table.lignes-table td.col-rm .insert-line{font-size:19px;}
  table.lignes-table td.col-rm .remove-line{font-size:21px;}
  table.lignes-table th .court{display:none;}
  /* ---------- Désignation : un champ d'une seule ligne (pas de poignée, pas d'espace vide) ----------
     Texte trop long : « … » au repos ; on le fait défiler de gauche à droite en le touchant. */
  table.lignes-table input.desig-ligne{
    display:block;width:100%;box-sizing:border-box;height:36px;padding:0 8px;
    font-size:14px;line-height:34px;white-space:nowrap;overflow-x:auto;text-overflow:ellipsis;
    border:1px solid transparent;border-radius:6px;background:transparent;
  }
  table.lignes-table input.desig-ligne:hover{border-color:var(--border);}
  table.lignes-table input.desig-ligne:focus{background:#fff;border-color:var(--amber-dark);outline:none;text-overflow:clip;}
  @media screen and (min-width:641px){
    table.lignes-table{min-width:0;table-layout:fixed;}
    table.lignes-table .col-desig{width:auto;}
    table.lignes-table .col-qte{width:80px;}
    table.lignes-table .col-pu{width:110px;}
    table.lignes-table .col-tot{width:130px;}
    table.lignes-table .col-rm{width:60px;}
    table.lignes-table td{padding:6px 6px;}
  }
  /* PC : colonnes de chiffres plus larges (la pleine largeur de la page est déjà gérée plus haut) */
  @media screen and (min-width:900px){
    table.lignes-table .col-qte{width:90px;}
    table.lignes-table .col-pu{width:130px;}
    table.lignes-table .col-tot{width:150px;}
    table.lignes-table .col-rm{width:64px;}
    table.lignes-table th, table.lignes-table td{font-size:14.5px;}
    table.lignes-table th{font-size:11.5px;padding:10px 8px;}
  }
  /* ---------- Téléphone : même tableau qu'à l'origine, compacté pour tenir dans la largeur ----------
     Une ligne par article, hauteur fixe, tout aligné au centre ; + et × côte à côte.
     La désignation est un champ d'une ligne : on fait glisser le texte pour le lire en entier. */
  @media screen and (max-width:640px){
    .table-scroll{overflow-x:hidden;}
    table.lignes-table{min-width:0;width:100%;table-layout:fixed;}
    table.lignes-table th{padding:7px 3px;font-size:10px;letter-spacing:.02em;}
    table.lignes-table th.col-qte{text-align:center;}
    table.lignes-table td{padding:0 2px;height:44px;vertical-align:middle;}
    table.lignes-table th.col-desig, table.lignes-table td.col-desig{width:auto;min-width:0;padding-left:5px;}
    table.lignes-table .col-qte{width:32px;}
    table.lignes-table .col-pu{width:62px;}
    table.lignes-table .col-tot{width:62px;}
    table.lignes-table .col-rm{width:44px;}
    table.lignes-table th .long{display:none;}
    table.lignes-table th .court{display:inline;}
    table.lignes-table input{
      box-sizing:border-box;height:32px;padding:0 2px;font-size:13.5px;line-height:32px;
      border:1px solid transparent;border-radius:6px;background:transparent;margin:0;
    }
    table.lignes-table input.desig-ligne{width:100%;padding:0 5px;text-overflow:ellipsis;}
    table.lignes-table input.desig-ligne:focus{text-overflow:clip;}
    table.lignes-table td.col-qte input{text-align:center;}
    table.lignes-table td.col-pu input{font-size:13px;}
    table.lignes-table input:focus{background:#fff;border-color:var(--amber-dark);}
    table.lignes-table .total-cell{font-size:12.5px;padding-right:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    table.lignes-table .total-cell .devise{display:none;}
    table.lignes-table td.col-section{padding:0 5px !important;}
    table.lignes-table td.col-section input{height:32px;line-height:32px;padding:0 4px !important;}
    /* + et × : même taille, côte à côte, centrés sur la ligne */
    table.lignes-table td.col-rm{padding:0;white-space:nowrap;text-align:center;font-size:0;}
    table.lignes-table td.col-rm button{
      display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;
      width:22px;height:30px;padding:0;margin:0;line-height:1;
    }
    table.lignes-table td.col-rm .insert-line{font-size:19px;}
    table.lignes-table td.col-rm .remove-line{font-size:21px;}
  }
  .totals-box{
    background:#F8FAFC;border:1px dashed var(--border);border-radius:10px;padding:12px;margin-top:8px;
  }
  .totals-box .t-row{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;}
  .totals-box .t-row.grand{font-size:16px;font-weight:800;color:var(--navy);border-top:1px solid var(--border);margin-top:6px;padding-top:8px;}
  .toast{
    position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;
    z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .toast.show{opacity:1;}
  .logo-preview{max-width:120px;max-height:60px;display:block;margin-bottom:8px;border-radius:6px;object-fit:contain;}
  .paste-zone{
    margin-top:8px;border:2px dashed var(--border);border-radius:8px;padding:14px;text-align:center;
    font-size:12.5px;color:var(--muted);cursor:text;background:#FAFBFC;
  }
  .paste-zone:focus{outline:none;border-color:var(--amber-dark);background:#FFF9EC;}

  /* ---------- Choix des couleurs ---------- */
  .color-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;font:inherit;color:var(--text);}
  .color-btn .dots{display:flex;}
  .color-btn .dots i{width:26px;height:26px;border-radius:50%;display:block;border:2px solid #fff;box-shadow:0 0 0 1px var(--border);}
  .color-btn .dots i+i{margin-left:-9px;}
  .color-btn-txt{flex:1;display:flex;flex-direction:column;}
  .color-btn-txt b{font-size:14.5px;color:var(--navy);}
  .color-btn-txt small{font-size:12px;color:var(--muted);margin-top:2px;}
  .color-btn-arrow{font-size:24px;color:var(--muted);line-height:1;}
  .theme-label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:16px 0 6px;}
  .theme-preview{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:10px;}
  .theme-preview .tp-head{color:#fff;font-weight:700;font-size:14px;padding:12px;}
  .theme-preview .tp-line{height:4px;}
  .theme-preview .tp-btn{display:inline-block;margin:10px 12px;padding:6px 14px;border-radius:7px;font-weight:700;font-size:12.5px;}
  .theme-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .theme-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;border-radius:20px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--text);}
  .theme-chip.actif{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset;font-weight:700;}
  .theme-chip .dots{display:flex;}
  .theme-chip .dots i{width:12px;height:12px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.08);}
  .theme-chip .dots i+i{margin-left:-4px;}
  .cible-row{display:flex;gap:8px;}
  .cible{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);background:#fff;border-radius:9px;padding:9px;font-size:12.5px;cursor:pointer;color:var(--text);}
  .cible i{width:16px;height:16px;border-radius:4px;display:block;border:1px solid rgba(0,0,0,.12);}
  .cible.actif{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset;font-weight:700;}
  .swatch-grid{display:flex;flex-wrap:wrap;gap:6px;}
  .swatch{width:34px;height:34px;flex:0 0 34px;border-radius:8px;border:1px solid rgba(0,0,0,.12);cursor:pointer;padding:0;}
  .swatch-grid.palette{max-width:234px;}
  .modal.modal-couleurs{max-width:440px;}
  @media (min-width:760px){
    .modal-overlay.centre{align-items:center;}
    .modal-overlay.centre .modal{border-radius:16px;}
  }
  .swatch:active{transform:scale(.92);}
  .helper{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .search-bar{margin-bottom:12px;}
  .champ-recherche{position:relative;margin:0 0 12px;}
  .champ-recherche input{
    width:100%;box-sizing:border-box;padding:10px 36px 10px 36px;
    border:1px solid var(--border);border-radius:9px;font-size:14px;background:#fff;
  }
  .champ-recherche input:focus{outline:none;border-color:var(--amber-dark);}
  .champ-recherche .loupe{position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none;}
  .champ-recherche .effacer{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);display:none;
    border:none;background:none;font-size:20px;line-height:1;color:var(--muted);cursor:pointer;padding:4px 8px;
  }
  .champ-recherche.rempli .effacer{display:block;}
  .aucun-resultat{display:none;text-align:center;color:var(--muted);font-size:13px;padding:14px 6px;}
  .modal .champ-recherche{position:sticky;top:-1px;z-index:2;background:#fff;padding-top:4px;margin-bottom:8px;}
  select#tabSelect{display:none;}

  /* ---------- Zone imprimable / PDF ---------- */
  #printArea{display:none;}
  @media print{
    @page{ size:A4; margin:10mm; }
    /* Tout ce qui n'est pas le document est retiré de la mise en page (display:none).
       Avant, il était seulement rendu invisible (visibility:hidden) : l'écran de
       l'application gardait sa hauteur et débordait sur une page blanche en fin de PDF. */
    html, body{ height:auto !important; min-height:0 !important; margin:0 !important; padding:0 !important; background:#fff !important; }
    body > *:not(#printArea){ display:none !important; }
    #printArea{
      display:block !important;position:static;width:100%;
      padding:0;margin:0;
    }
    #printArea > .doc-page > :last-child{ margin-bottom:0 !important; }
    /* Évite les pages quasi vides : le pied de page reste collé au bloc de signature
       (s'il ne tient pas, les deux passent ensemble à la page suivante), et ni une
       ligne de tableau, ni les totaux ne sont coupés en deux entre deux pages. */
    .doc-signature{ break-inside:avoid; page-break-inside:avoid; break-after:avoid; page-break-after:avoid; }
    .doc-footer{ break-before:avoid; page-break-before:avoid; margin-top:10px !important; }
    .doc-totals, .doc-notes, .doc-meta{ break-inside:avoid; page-break-inside:avoid; }
    table.doc-table tr{ break-inside:avoid; page-break-inside:avoid; }
    .doc-page{ padding:0 !important; max-width:100% !important; }
    .no-print{display:none !important;}
  }
  .doc-page{
    background:#fff;color:#16212E;font-family:Verdana,Arial,Helvetica,sans-serif;
    max-width:800px;margin:0 auto;padding:26px;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;
  }
  .doc-page *{
    -webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;
  }
  .doc-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--amber);padding-bottom:14px;margin-bottom:18px;}
  .doc-header .logo-img{max-width:150px;max-height:70px;object-fit:contain;}
  .doc-header .ent-block{font-size:11.5px;line-height:1.5;max-width:260px;}
  .doc-header .ent-block .ent-name{font-size:15px;font-weight:800;color:var(--navy);margin-bottom:3px;}
  .doc-title{text-align:right;}
  .doc-title h2{font-size:20px;color:var(--navy);}
  .doc-title .num{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .doc-meta{display:flex;justify-content:space-between;gap:20px;margin-bottom:18px;font-size:12.5px;}
  .doc-meta .box{border:1px solid #E1E5EA;border-radius:8px;padding:10px 12px;flex:1;}
  .doc-meta .box h3{font-size:11px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;letter-spacing:.04em;}
  table.doc-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px;}
  table.doc-table th{
    background:var(--navy);color:#fff;text-align:left;padding:8px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;
  }
  table.doc-table td{padding:7px 8px;border-bottom:1px solid #EDEFF2;}
  table.doc-table tr:nth-child(even) td{background:#FAFBFC;}
  .doc-totals{display:flex;justify-content:flex-end;margin-bottom:18px;}
  .doc-totals table{border-collapse:collapse;font-size:12.5px;min-width:260px;}
  .doc-totals td{padding:4px 8px;}

<script>
/* ============================ STOCKAGE ============================ */
const KEY_ENT='ed_entreprise', KEY_ENTS='ed_entreprises', KEY_ACTIVE_ENT='ed_active_entreprise';
const KEY_ART='ed_articles', KEY_DEV='ed_devis', KEY_SEQ='ed_seq';

function load(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function save(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

function entrepriseVierge(){
  return {
    id: uid(),
    nom:'', adresse:'', cp:'', ville:'', tel:'', email:'',
    identifiantFiscal:'', rge:'', assurance:'',
    mentions:"Assurance responsabilité civile professionnelle souscrite.\nRèglement : 30% à la commande, solde à la réception des travaux.",
    logo:'', tampon:'', signature:'', theme:'navy'
  };
}

// Migration : les installations existantes n'avaient qu'une seule entreprise
// (stockée sous KEY_ENT). On la transforme en tableau d'une entreprise si le
// nouveau format n'existe pas encore — aucune donnée n'est perdue.
let entreprises = load(KEY_ENTS, null);
if(!entreprises){
  const ancienne = load(KEY_ENT, null);
  const premiere = ancienne ? Object.assign(entrepriseVierge(), ancienne, {id: uid()}) : entrepriseVierge();
  entreprises = [premiere];
  save(KEY_ENTS, entreprises);
}
let activeEntrepriseId = load(KEY_ACTIVE_ENT, entreprises[0].id);
if(!entreprises.find(e=>e.id===activeEntrepriseId)) activeEntrepriseId = entreprises[0].id;

function saveEntreprises(){ save(KEY_ENTS, entreprises); }
function getActiveEntreprise(){ return entreprises.find(e=>e.id===activeEntrepriseId) || entreprises[0]; }
function entrepriseForDevis(d){
  if(d && d.entrepriseId){
    const trouve = entreprises.find(e=>e.id===d.entrepriseId);
    if(trouve) return trouve;
  }
  return entreprise;
}

// ⚠️ "entreprise" reste une RÉFÉRENCE vivante vers l'entreprise active dans le
// tableau "entreprises" — tout le code existant qui lit/modifie entreprise.xxx
// continue de fonctionner sans changement, tant qu'on réassigne cette variable
// (via changerEntrepriseActive) au lieu de la remplacer par une copie.
let entreprise = getActiveEntreprise();

function changerEntrepriseActive(id){
  if(!entreprises.find(e=>e.id===id)) return;
  activeEntrepriseId = id;
  save(KEY_ACTIVE_ENT, activeEntrepriseId);
  entreprise = getActiveEntreprise();
}

/* ============================ ENTREPRISES SUPPLÉMENTAIRES (licence) ============================ */
// Nombre d'entreprises inclus par défaut dans toute licence : 1. Au-delà, chaque
// entreprise supplémentaire est un service payant distinct, débloqué par un code
// séparé (voir computeEntrepriseSlotsKey) — n'affecte jamais la clé d'activation
// principale de l'appareil, qui reste strictement inchangée.
const KEY_MAX_ENT = 'ed_max_entreprises';
let maxEntreprises = load(KEY_MAX_ENT, 1);

let articles = load(KEY_ART, []);
let devisList = load(KEY_DEV, []);
let rawSeq = load(KEY_SEQ, {devis:1, facture:1});
let seq = (typeof rawSeq === 'number') ? {devis:rawSeq, facture:1} : rawSeq;

/* ============================ DONNÉES SÉPARÉES PAR ENTREPRISE ============================ */
// Chaque entreprise a ses propres documents (devis/factures), sa propre bibliothèque
// d'articles et sa propre numérotation. Les données déjà enregistrées (créées avant
// cette mise à jour) sont rattachées à la première entreprise : rien n'est perdu.
const KEY_SEQ_ENT = 'ed_seq_ent';
let seqParEnt = load(KEY_SEQ_ENT, null);
(function migrerParEntreprise(){
  const premiere = entreprises[0].id;
  const existe = id => entreprises.some(e=>e.id===id);
  let modif = false;
  devisList.forEach(d=>{ if(!d.entrepriseId || !existe(d.entrepriseId)){ d.entrepriseId = premiere; modif = true; } });
  if(modif) save(KEY_DEV, devisList);
  modif = false;
  articles.forEach(a=>{ if(!a.entrepriseId || !existe(a.entrepriseId)){ a.entrepriseId = premiere; modif = true; } });
  if(modif) save(KEY_ART, articles);
  if(!seqParEnt){
    seqParEnt = {};
    seqParEnt[premiere] = {devis: seq.devis||1, facture: seq.facture||1};
    save(KEY_SEQ_ENT, seqParEnt);
  }
})();
function docsActifs(){ return devisList.filter(d=>d.entrepriseId===activeEntrepriseId); }
function articlesActifs(){ return articles.filter(a=>a.entrepriseId===activeEntrepriseId); }
function seqPour(entId){
  if(!seqParEnt[entId]) seqParEnt[entId] = {devis:1, facture:1};
  return seqParEnt[entId];
}
function incrSeq(type, entId){
  const s = seqPour(entId || activeEntrepriseId);
  s[type] = (s[type]||1) + 1;
  save(KEY_SEQ_ENT, seqParEnt);
}

/* ============================ LICENCE / ACTIVATION (multi-écrans, 365 jours glissants) ============================ */
// ⚠️ IMPORTANT : remplacez cette valeur par votre propre secret avant de distribuer
// l'application, et utilisez EXACTEMENT le même secret dans votre générateur de clés
// (generateur-cles.html). Sans cela, aucune clé ne fonctionnera.
const LICENSE_SECRET = "HSM14-68BRA-GNI34-00001";
const KEY_LICENSE = 'ed_license';
const TRIAL_DAYS = 3;
const PLAN_DURATIONS = { '1M': 30, '1A': 365 };
const PLAN_LABELS = { '1M': '1 mois', '1A': '1 an' };

function isoToday(){ return new Date().toISOString().slice(0,10); }
function addDaysISO(dateStr, days){
  const d = new Date((dateStr||isoToday())+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function daysRemainingUntil(untilISO){
  const today = new Date(isoToday()+'T00:00:00');
  const until = new Date((untilISO||isoToday())+'T00:00:00');
  return Math.max(0, Math.round((until-today)/86400000));
}

// deviceCode : généré automatiquement et aléatoirement par CET appareil précis, au tout
// premier lancement. Il est différent sur chaque téléphone/PC/Mac. La clé calculée à partir
// de ce code ne fonctionnera QUE sur cet appareil précis — c'est voulu (anti-partage).
// Pour un client qui achète plusieurs écrans, il faut générer une clé PAR appareil (voir
// le mode "génération par lot" dans generateur-cles.html).
// planType : '1M' (1 mois) ou '1A' (1 an) — change la clé attendue ET la durée accordée.
function computeActivationKey(deviceCode, renewalIndex, planType, secret){
  const input = normalizeKey(deviceCode) + '#' + String(renewalIndex||0) + '#' + (planType||'') + '|' + (secret||'');
  let h1 = 0, h2 = 0;
  for(let i=0;i<input.length;i++){
    const c = input.charCodeAt(i);
    h1 = (Math.imul(h1, 131) + c) >>> 0;
    h2 = (Math.imul(h2, 137) + c + i) >>> 0;
  }
  h1 = (h1 ^ (h1 >>> 15)) >>> 0;
  h2 = (h2 ^ (h2 >>> 13)) >>> 0;
  const combined = (h1.toString(16) + h2.toString(16) + h1.toString(36) + h2.toString(36)).toUpperCase().replace(/[^A-Z0-9]/g,'');
  let key = combined.slice(0,12).padEnd(12,'0');
  return key.match(/.{1,4}/g).join('-');
}
function normalizeKey(s){ return (s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }

// Clé séparée (espace de hachage distinct "#ENT#") pour débloquer un nombre total
// d'entreprises sur cet appareil. N'a aucune incidence sur la clé d'activation
// principale — peut être redemandée/régénérée indépendamment à tout moment.
function computeEntrepriseSlotsKey(deviceCode, nbEntreprises, secret){
  return computeActivationKey(deviceCode, 0, 'ENT'+String(nbEntreprises||1), secret);
}
function generateDeviceCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sans caractères ambigus (0/O, 1/I)
  let code = '';
  for(let i=0;i<8;i++){ code += chars[Math.floor(Math.random()*chars.length)]; }
  return code.match(/.{1,4}/g).join('-');
}

const WHATSAPP_NUMBER = '22893346814';
function buildWhatsappLink(license, nextRenewalIndex, statusKind){
  let action = 'activer';
  if(statusKind==='license_expired') action = 'renouveler';

  return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
}

function showLockScreen(license, nextRenewalIndex, statusKind, expiryDate, mandatory){

  if(statusKind === 'revoked'){

      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" style="margin-bottom:12px;"><rect x="4" y="2" width="16" height="20" rx="2" stroke="#10233A" stroke-width="1.6"/><path d="M7.5 7.5H16.5M7.5 11.5H16.5M7.5 15.5H13" stroke="#10233A" stroke-width="1.6" stroke-linecap="round"/></svg>

      <div style="background:#F5F7FA;border:1px dashed #E1E5EA;border-radius:8px;padding:10px;margin-bottom:8px;">
        <div style="font-weight:700;font-size:16px;letter-spacing:.05em;color:#10233A;">${escapeHtml(license.deviceCode)}</div>
        <div style="font-size:11.5px;color:#5B6B7C;margin-top:4px;">Renouvellement n° <strong>${nextRenewalIndex}</strong></div>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <label style="flex:1;border:1px solid #E1E5EA;border-radius:8px;padding:9px;font-size:12.5px;font-weight:700;color:#10233A;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;">
          <input type="radio" name="planType" value="1M" ${defaultPlan==='1M'?'checked':''} style="width:auto;"> 1 mois
        </label>
        <label style="flex:1;border:1px solid #E1E5EA;border-radius:8px;padding:9px;font-size:12.5px;font-weight:700;color:#10233A;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;">
          <input type="radio" name="planType" value="1A" ${defaultPlan==='1A'?'checked':''} style="width:auto;"> 1 an

      </div>
      <input type="text" id="licenseInput" placeholder="Clé d'activation" style="width:100%;box-sizing:border-box;padding:11px;border:1px solid #E1E5EA;border-radius:8px;font-size:15px;text-align:center;text-transform:uppercase;margin-bottom:10px;">
      <div id="licenseError" style="color:#C4432B;font-size:12.5px;margin-bottom:10px;display:none;">Clé invalide. Vérifiez la saisie et le plan sélectionné.</div>
      <button id="licenseSubmit" style="width:100%;padding:11px;border:none;border-radius:9px;background:#F5B93D;color:#10233A;font-weight:700;font-size:14px;cursor:pointer;">Déverrouiller</button>
      <a href="${ONLINE_PAYMENT_LINK}" target="_blank" rel="noopener" style="margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;padding:11px;border-radius:9px;background:#10233A;color:#fff;font-weight:700;font-size:13.5px;text-decoration:none;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="#fff" stroke-width="1.7"/><path d="M3 9.5H21" stroke="#fff" stroke-width="1.7"/><path d="M6.5 14.5H10" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg>
        Payer ma licence en ligne
      </a>
      <a href="${waLink}" target="_blank" rel="noopener" style="margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;padding:11px;border-radius:9px;background:#25D366;color:#fff;font-weight:700;font-size:13.5px;text-decoration:none;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 3a9 9 0 0 0-7.75 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3Z" stroke="#fff" stroke-width="1.7"/><path d="M8.5 8.7c.2-.5.5-.5.8-.5h.6c.2 0 .4 0 .6.4.2.5.7 1.6.7 1.8.1.1.1.3 0 .4-.1.2-.2.3-.3.5-.2.2-.3.3-.1.6.7 1.2 1.5 1.9 2.6 2.4.2.1.4.1.5-.1.2-.2.6-.7.8-.9.2-.2.3-.2.6-.1.2.1 1.5.7 1.8.9.2.1.4.2.4.3.1.3.1.9-.2 1.4-.3.5-1.4 1-1.9 1-1.3.1-2.7-.5-4.3-1.8-1.9-1.5-3-3.2-3.2-3.6-.2-.4-.9-1.5-.9-2.7 0-1.2.6-1.7.8-1.9Z" fill="#fff"/></svg>
        Contacter via WhatsApp
      </a>

  `;
  document.body.appendChild(overlay);

  if(!mandatory){

  }

  const submit = ()=>{
    const planTypeEl = overlay.querySelector('input[name="planType"]:checked');
    const planType = planTypeEl ? planTypeEl.value : '1A';
    const raw = document.getElementById('licenseInput').value;
    const expected = normalizeKey(computeActivationKey(license.deviceCode, nextRenewalIndex, planType, LICENSE_SECRET));
    if(normalizeKey(raw) === expected){
      const today = isoToday();
      const lic = load(KEY_LICENSE, {});
      lic.deviceCode = license.deviceCode;
      lic.activated = true;
      lic.renewalIndex = nextRenewalIndex;
      lic.planType = planType;
      lic.activatedDate = today;
      lic.expiryDate = addDaysISO(today, PLAN_DURATIONS[planType] || 365);
      lic.key = raw.trim().toUpperCase();
      save(KEY_LICENSE, lic);
      overlay.remove();
      const banner = document.getElementById('trialBanner');
      if(banner) banner.remove();
      render();
    } else {
      document.getElementById('licenseError').textContent = 'Identifiant ou clé invalide. Vérifiez la saisie.';
      document.getElementById('licenseError').style.display='block';
    }
  };
  document.getElementById('licenseSubmit').addEventListener('click', submit);

}

/* ============================ UTILITAIRES ============================ */

function uid(){ return 'id'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function triggerPrint(){
  try{
    if(window.Android && typeof window.Android.print === 'function'){
      window.Android.print();
      return;
    }
  }catch(e){}
  try{
    if(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosPrint){
      window.webkit.messageHandlers.iosPrint.postMessage('print');
      return;
    }
  }catch(e){}
  window.print();
}
function fcfa(n){ return Math.round(n+Number.EPSILON).toLocaleString('fr-FR') + ' FCFA'; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function frDate(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._h); showToast._h=setTimeout(()=>t.classList.remove('show'),1800);
}
function nextNumero(type, entId){
  const year=new Date().getFullYear();
  const prefix = type==='facture' ? 'FAC-' : 'DEV-';
  const n = prefix+year+'-'+String(seqPour(entId || activeEntrepriseId)[type]||1).padStart(4,'0');
  return n;
}
function docTypeLabel(type){ return type==='facture' ? 'Facture' : 'Devis'; }

/* ============================ RECHERCHE ============================ */
// Minuscules, sans accents ni espaces superflus : "Câble" et "cable" se trouvent.
function normaliser(s){
  return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
    .replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[’']/g,"'").replace(/\s+/g,' ').trim();
}
// Chaîne HTML d'un champ de recherche. `id` sert à le retrouver après insertion.
function champRecherche(id, placeholder, valeur){
  return `<div class="champ-recherche${valeur?' rempli':''}" id="${id}">
    <svg class="loupe" width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#5B6B7C" stroke-width="2"/><path d="M20 20L16.5 16.5" stroke="#5B6B7C" stroke-width="2" stroke-linecap="round"/></svg>
    <input type="text" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="${escapeHtml(placeholder)}" value="${escapeHtml(valeur||'')}">
    <button type="button" class="effacer" aria-label="Effacer la recherche">&times;</button>
  </div>`;
}
// Branche un champ de recherche sur une liste d'éléments portant un attribut
// data-recherche (texte déjà normalisé). On masque/affiche sans reconstruire la
// liste : le clavier et le curseur ne sautent pas pendant la frappe.
function brancherRecherche(racine, idChamp, selecteurItems, idAucun, surChangement){
  const bloc = racine.querySelector('#'+idChamp);
  if(!bloc) return;
  const input = bloc.querySelector('input');
  const aucun = idAucun ? racine.querySelector('#'+idAucun) : null;
  const appliquer = ()=>{
    const mots = normaliser(input.value).split(' ').filter(Boolean);
    let visibles = 0;
    racine.querySelectorAll(selecteurItems).forEach(el=>{
      const texte = el.dataset.recherche || '';
      const ok = mots.every(m=>texte.includes(m));
      el.style.display = ok ? '' : 'none';
      if(ok) visibles++;
    });
    bloc.classList.toggle('rempli', input.value.length>0);
    if(aucun) aucun.style.display = (visibles===0 && mots.length) ? 'block' : 'none';
    if(surChangement) surChangement(input.value);
  };
  input.addEventListener('input', appliquer);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') input.blur(); });
  bloc.querySelector('.effacer').addEventListener('click', ()=>{ input.value=''; appliquer(); input.focus(); });
  appliquer();
}
// Sur ordinateur : la molette ou les touches ↑↓ ne doivent pas changer une quantité
// ou un prix par accident pendant qu'on fait défiler la page.
document.addEventListener('wheel', e=>{
  const el = document.activeElement;
  if(el && el.type==='number' && el===e.target) el.blur();
}, {passive:true});
document.addEventListener('keydown', e=>{
  if((e.key==='ArrowUp' || e.key==='ArrowDown') && e.target && e.target.type==='number') e.preventDefault();
});
// Désignation d'une ligne : sur PC, une fois le champ sélectionné (ou avec Maj + molette),
// la molette fait défiler le texte de gauche à droite au lieu de faire défiler la page.
document.addEventListener('wheel', e=>{
  const el = e.target;
  if(!el || !el.classList || !el.classList.contains('desig-ligne')) return;
  if(el.scrollWidth <= el.clientWidth) return;              // texte court : rien à faire défiler
  if(document.activeElement !== el && !e.shiftKey) return;  // sinon la page défile normalement
  const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  const max = el.scrollWidth - el.clientWidth;
  const avant = el.scrollLeft;
  el.scrollLeft = Math.max(0, Math.min(max, avant + delta));
  if(el.scrollLeft !== avant) e.preventDefault();          // en butée, on rend la main à la page
}, {passive:false});

function majBarreEntreprise(){
  const bar = document.getElementById('entBar');
  if(!bar) return;
  // Affichée seulement s'il y a plusieurs entreprises, jamais pendant l'édition d'un
  // document (un brouillon non enregistré serait perdu) ni dans l'onglet Entreprise

  bar.style.display = 'flex';

  }</select>`;
  document.getElementById('entBarSelect').addEventListener('change', e=>basculerEntreprise(e.target.value));

function basculerEntreprise(id){
  if(id === activeEntrepriseId) return;
  changerEntrepriseActive(id);
  appliquerTheme(entreprise.theme || 'navy');
  rechercheDocuments = ''; rechercheArticles = '';
  window.scrollTo(0,0);
  render();

/* ============================ REPRISE OÙ ON S'ÉTAIT ARRÊTÉ ============================ */
// L'état (onglet, entreprise, recherche, position de défilement et brouillon du
// document en cours d'édition) est sauvegardé en continu. Si l'application est quittée,
// mise en arrière-plan puis rechargée par le système, on retrouve exactement l'écran
// et la saisie en cours.
const KEY_SESSION = 'ed_session';
function saveSession(){
  try{
    const main = document.getElementById('main');
    if(!main || !main.children.length) return; // rien d'affiché (écran de verrouillage) : on ne touche pas à la session
    const s = { tab:currentTab, entId:activeEntrepriseId, rechDocs:rechercheDocuments, rechArts:rechercheArticles,
                scrollY: window.scrollY||0, t: Date.now(), editing:null };
    if(editingDevisId !== null && typeof window._editorGet === 'function'){
      const g = window._editorGet();
      if(g) s.editing = { id:g.id, draft:g.devis };
    }
    localStorage.setItem(KEY_SESSION, JSON.stringify(s));
  }catch(e){ /* stockage plein ou indisponible : on ignore */ }
}
let _sessionTimer = null;
function saveSessionDebounced(){ clearTimeout(_sessionTimer); _sessionTimer = setTimeout(saveSession, 300); }
window.addEventListener('pagehide', saveSession);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'hidden') saveSession(); });
window.addEventListener('scroll', saveSessionDebounced, {passive:true});
['input','change'].forEach(ev=>document.getElementById('main').addEventListener(ev, saveSessionDebounced));

function restaurerSession(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(KEY_SESSION) || 'null'); }catch(e){}
  if(!s) return false;
  try{
    if(s.entId && s.entId !== activeEntrepriseId && entreprises.some(e=>e.id===s.entId)){
      changerEntrepriseActive(s.entId);
      appliquerTheme(entreprise.theme || 'navy');
    }
    rechercheDocuments = s.rechDocs || '';
    rechercheArticles = s.rechArts || '';
    currentTab = ['devis','articles','entreprise'].includes(s.tab) ? s.tab : 'devis';
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===currentTab));
    render();
    const ed = s.editing;
    if(ed && ed.draft && currentTab === 'devis' && (!ed.id || devisList.some(d=>d.id===ed.id))){
      openDevisEditor(ed.id || null, ed.draft.type, ed.draft);
    }
    const y = s.scrollY || 0;
    if(y > 0){ setTimeout(()=>window.scrollTo(0,y), 60); setTimeout(()=>window.scrollTo(0,y), 350); }
    return true;
  }catch(e){
    console.error('Restauration impossible :', e);
    editingDevisId = null; currentTab = 'devis';
    render();
    return true;
  }
}

// Appelée par l'application Android à chaque appui sur le bouton "retour" physique/
// gestuel du téléphone. Gère la navigation interne (fermer une modale, quitter
// l'éditeur de devis, revenir à l'onglet Documents) et ne renvoie 'home' que
// lorsqu'il n'y a plus rien à faire côté JS — c'est uniquement dans ce cas que
// l'app Android doit proposer de quitter l'application.
window.handleAndroidBack = function(){
  const openModal = document.querySelector('.modal-overlay');
  if(openModal){ openModal.remove(); if(typeof majBoutonCouleurs==='function') majBoutonCouleurs(); return 'handled'; }

  if(editingDevisId !== null){
    editingDevisId = null;
    currentTab = 'devis';
    render();
    return 'handled';
  }

  if(currentTab !== 'devis'){
    const devisTabBtn = document.querySelector('nav.tabs button[data-tab="devis"]');
    if(devisTabBtn) devisTabBtn.click();
    return 'handled';
  }

  return 'home';
};

  const words = (nom||'').trim().split(/\s+/).filter(Boolean);
  if(words.length===0) return 'DP';
  if(words.length===1) return words[0].slice(0,2).toUpperCase();
  return (words[0][0]+words[1][0]).toUpperCase();
}

  bordeaux: { label:'Bordeaux',       primary:'#3D0F1A', accent:'#E0A85C' },
  rouge:    { label:'Rouge',          primary:'#5A0E0E', accent:'#E5484D' },

// Palette libre (tableau de choix) : 48 couleurs couvrant toutes les teintes,
// de la plus foncée à la plus claire.
const PALETTE = [
  '#000000','#1C1C1C','#3A3A3A','#5E5E5E','#8A8A8A','#B5B5B5',
  '#10233A','#0B2A6F','#1E4FA8','#3D8BFD','#5BB8D6','#9ED8EE',
  '#0B3B3C','#0F6E6A','#2EC4B6','#0F3D2E','#1E7A4C','#4FBF8B',
  '#1F3A12','#4C7A1E','#9BCB3C','#5C5A10','#B8A51C','#F2D43D',
  '#3A2410','#8A4B12','#F08A24','#F5B93D','#D4AF37','#E0A85C',
  '#5A0E0E','#9E1B1B','#E5484D','#F27D72','#3D0F1A','#7A1E35',
  '#4A1030','#A3255E','#F0679E','#2E1A47','#5B2D8E','#9B6BD6',
  '#3B2418','#6E4A33','#C8935A','#2B2F36','#4A5563','#8FA3B8'
];

function hexToRgb(h){
  h = (h||'').replace('#','');
  if(h.length===3) h = h.split('').map(c=>c+c).join('');
  const n = parseInt(h,16);
  if(isNaN(n) || h.length!==6) return null;
  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}
function rgbToHex(r,g,b){
  return '#' + [r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('').toUpperCase();
}
function melanger(hex, cible, t){ // t entre 0 et 1 : mélange vers blanc (cible=255) ou noir (0)
  const c = hexToRgb(hex); if(!c) return hex;
  return rgbToHex(c.r+(cible-c.r)*t, c.g+(cible-c.g)*t, c.b+(cible-c.b)*t);
}
function eclaircir(hex,t){ return melanger(hex,255,t); }
function assombrir(hex,t){ return melanger(hex,0,t); }
function luminance(hex){
  const c = hexToRgb(hex); if(!c) return 0;
  const f = v => { v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); };
  return 0.2126*f(c.r) + 0.7152*f(c.g) + 0.0722*f(c.b);
}
function saturation(hex){
  const c = hexToRgb(hex); if(!c) return 0;
  const mx = Math.max(c.r,c.g,c.b), mn = Math.min(c.r,c.g,c.b);
  return mx===0 ? 0 : (mx-mn)/mx;
}
// La couleur principale porte du texte blanc (en-têtes, tableau imprimé) :
// on l'assombrit automatiquement si elle est trop claire pour rester lisible.
function principaleLisible(hex){
  let h = hex, i = 0;
  while(luminance(h) > 0.18 && i < 12){ h = assombrir(h, 0.12); i++; }
  return h;
}

function couleursEntreprise(ent){
  if(ent && ent.theme === 'custom' && ent.couleurs && hexToRgb(ent.couleurs.primary) && hexToRgb(ent.couleurs.accent)){
    return { primary: ent.couleurs.primary, accent: ent.couleurs.accent };
  }
  const t = THEMES[(ent && ent.theme) || 'navy'] || THEMES.navy;
  return { primary: t.primary, accent: t.accent };
}

// Accepte un nom de thème (compatibilité) — mais lit toujours les couleurs de
// l'entreprise courante, ce qui couvre aussi le mode "personnalisé".
function appliquerTheme(){
  const c = couleursEntreprise(entreprise);
  const primary = principaleLisible(c.primary);
  const r = document.documentElement.style;
  r.setProperty('--navy', primary);
  r.setProperty('--navy-2', eclaircir(primary, 0.18));
  r.setProperty('--amber', c.accent);
  r.setProperty('--amber-dark', assombrir(c.accent, 0.15));
}
appliquerTheme();

// Extrait les couleurs dominantes d'une image (logo) : réduit l'image, ignore
// le transparent et le quasi-blanc, regroupe les pixels proches, puis garde
// les teintes les plus présentes et suffisamment différentes entre elles.
function extraireCouleursLogo(dataUrl){
  return new Promise(resolve=>{
    if(!dataUrl){ resolve([]); return; }
    const img = new Image();
    img.onload = ()=>{
      try{
        const S = 64;
        const cv = document.createElement('canvas');
        cv.width = S; cv.height = S;
        const ctx = cv.getContext('2d');
        ctx.drawImage(img, 0, 0, S, S);
        const d = ctx.getImageData(0, 0, S, S).data;
        const groupes = {};
        for(let i=0;i<d.length;i+=4){
          if(d[i+3] < 128) continue;                                  // transparent
          if(d[i]>235 && d[i+1]>235 && d[i+2]>235) continue;          // fond blanc
          const k = (d[i]>>4)+','+(d[i+1]>>4)+','+(d[i+2]>>4);
          if(!groupes[k]) groupes[k] = { n:0, r:0, g:0, b:0 };
          const gr = groupes[k]; gr.n++; gr.r+=d[i]; gr.g+=d[i+1]; gr.b+=d[i+2];
        }
        const tries = Object.values(groupes).sort((a,b)=>b.n-a.n)
          .map(gr=>rgbToHex(gr.r/gr.n, gr.g/gr.n, gr.b/gr.n));
        const retenues = [];
        for(const h of tries){
          const c = hexToRgb(h);
          const tropProche = retenues.some(x=>{
            const y = hexToRgb(x);
            return Math.abs(c.r-y.r)+Math.abs(c.g-y.g)+Math.abs(c.b-y.b) < 70;
          });
          if(!tropProche) retenues.push(h);
          if(retenues.length >= 8) break;
        }
        resolve(retenues);
      }catch(e){ resolve([]); }
    };
    img.onerror = ()=>resolve([]);
    img.src = dataUrl;
  });
}

// Suggestion automatique : principale = couleur dominante la plus foncée,
// accent = couleur la plus vive parmi les autres.
function suggererDepuisLogo(couleurs){
  if(!couleurs.length) return null;
  const parFoncee = [...couleurs].sort((a,b)=>luminance(a)-luminance(b));
  const primary = parFoncee[0];
  const autres = couleurs.filter(c=>c!==primary);
  const accent = autres.length
    ? [...autres].sort((a,b)=>saturation(b)-saturation(a))[0]
    : eclaircir(primary, 0.45);
  return { primary, accent };
}

      if(!zone) return;
      if(!couleurs.length){ zone.innerHTML = '<div class="helper">Aucune couleur exploitable trouvée dans le logo.</div>'; return; }
      zone.innerHTML = `
        <div class="swatch-grid logo">${couleurs.map(h=>pastille(h, `data-logo-hex="${h}"`)).join('')}</div>
        <button type="button" class="btn btn-amber btn-block" id="autoLogoBtn" style="margin-top:8px;">✨ Appliquer automatiquement les couleurs du logo</button>`;
      zone.querySelectorAll('[data-logo-hex]').forEach(b=>b.addEventListener('click', ()=>appliquerSurCible(b.dataset.logoHex)));
      document.getElementById('autoLogoBtn').addEventListener('click', ()=>{
        const s = suggererDepuisLogo(couleurs);
        if(!s) return;
        definirCouleurs(s.primary, s.accent);
        renderThemeCard();
        showToast('Couleurs du logo appliquées');
      });
    };
    if(couleursLogoCache.src === entreprise.logo) afficher(couleursLogoCache.couleurs);
    else extraireCouleursLogo(entreprise.logo).then(couleurs=>{
      couleursLogoCache = { src: entreprise.logo, couleurs };
      afficher(couleurs);
    });
  }
}

      const img=new Image();
      img.onload=function(){
        const scale=Math.min(1, maxW/img.width);
        const canvas=document.createElement('canvas');

        saveEntreprises();
        renderEntreprise();
        showToast(label+' mis à jour');

      img.src=ev.target.result;

    reader.readAsDataURL(file);

  function bindPasteZone(zoneId, field, label){
    const zone=document.getElementById(zoneId);
    if(!zone) return;
    zone.addEventListener('paste', (e)=>{
      const items=(e.clipboardData||window.clipboardData).items;
      for(let i=0;i<items.length;i++){
        if(items[i].type.indexOf('image')!==-1){
          const file=items[i].getAsFile();
          processImageFile(file, field, 500, label);
          e.preventDefault();
          return;
        }
      }
      showToast("Aucune image trouvée dans le presse-papiers");
    });
  }

  document.getElementById('tamponInput').addEventListener('change', (e)=>{
    processImageFile(e.target.files[0], 'tampon', 500, 'Tampon');
  });
  document.getElementById('signatureInput').addEventListener('change', (e)=>{
    processImageFile(e.target.files[0], 'signature', 500, 'Signature');

/* ============================ DEVIS : LISTE ============================ */
function statutLabel(s, type){
  if(type==='facture'){
    return {brouillon:'Brouillon', envoye:'Envoyée', accepte:'Payée', refuse:'Impayée'}[s] || 'Brouillon';
  }
  return {brouillon:'Brouillon', envoye:'Envoyé', accepte:'Accepté', refuse:'Refusé'}[s] || 'Brouillon';
}
function computeTotals(devis){
  const remise = devis.remisePct||0;
  let sousTotal=0, sousTotalBrut=0;
  devis.lignes.forEach(l=>{
    if(l.type==='section') return; // une section n'a pas de prix, elle ne fait que regrouper des lignes
    const brut = l.qte * l.prixUnitaire;
    sousTotalBrut += brut;
    sousTotal += brut * (1 - remise/100);
  });
  const remiseMontant = sousTotalBrut - sousTotal;
  const mainOeuvre = devis.type==='facture' ? 0 : (devis.mainOeuvre||0);
  const total = sousTotal + mainOeuvre;
  return {sousTotal, sousTotalBrut, remiseMontant, mainOeuvre, total};
}

function renderDevisList(){
  const m=document.getElementById('main');
  const mesDocs = docsActifs();
  let listHtml='';
  if(mesDocs.length===0){
    listHtml=`<div class="empty-state">
      <svg class="bolt" viewBox="0 0 24 24" fill="none"><rect x="4" y="2" width="16" height="20" rx="2" stroke="#5B6B7C" stroke-width="1.6"/><path d="M7.5 7.5H16.5M7.5 11.5H16.5M7.5 15.5H13" stroke="#5B6B7C" stroke-width="1.6" stroke-linecap="round"/></svg>
      <div>Aucun document pour le moment.<br>Appuyez sur le bouton + pour créer votre premier devis ou facture.</div>
    </div>`;
  } else {
    const sorted=[...mesDocs].sort((a,b)=> (b.dateCreation||'').localeCompare(a.dateCreation||''));
    listHtml = sorted.map(d=>{
      const t=computeTotals(d);
      const type = d.type||'devis';
      const c = d.client||{};
      const recherche = normaliser([
        d.numero, docTypeLabel(type), c.nom, c.ville, c.tel, c.email,
        frDate(d.dateCreation), fcfa(t.total), Math.round(t.total), statutLabel(d.statut, type)
      ].join(' '));
      return `
      <div class="list-item" data-recherche="${escapeHtml(recherche)}">
        <div>
          <div class="name">${type==='facture'?'🧾':'📄'} ${d.numero} — ${escapeHtml(c.nom)||'Client sans nom'}</div>
          <div class="meta">${frDate(d.dateCreation)} · ${fcfa(t.total)} <span class="pill ${d.statut}">${statutLabel(d.statut, type)}</span></div>
        </div>
        <div class="actions-row">
          <button class="btn btn-ghost btn-sm" data-open-dev="${d.id}">Ouvrir</button>
        </div>
      </div>`;
    }).join('');
  }
  const recherche = mesDocs.length
    ? champRecherche('rechDocs', 'Rechercher : numéro, client, montant, date…', rechercheDocuments)
    : '';
  m.innerHTML = `<div class="card"><h2>Vos documents</h2>${recherche}${listHtml}
    <div class="aucun-resultat" id="aucunDoc">Aucun document ne correspond à cette recherche.</div></div>`;
  m.querySelectorAll('[data-open-dev]').forEach(b=>b.addEventListener('click',()=>openDevisEditor(b.dataset.openDev)));
  brancherRecherche(m, 'rechDocs', '.list-item[data-recherche]', 'aucunDoc', v=>{ rechercheDocuments = v; });
}

      <div class="field"><label>Adresse</label><input type="text" id="c_adresse" value="${escapeHtml(devis.client.adresse)}"></div>
      <div class="row2">
        <div class="field"><label>Code postal</label><input type="text" id="c_cp" value="${escapeHtml(devis.client.cp)}"></div>
        <div class="field"><label>Ville</label><input type="text" id="c_ville" value="${escapeHtml(devis.client.ville)}"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Téléphone</label><input type="tel" id="c_tel" value="${escapeHtml(devis.client.tel)}"></div>
        <div class="field"><label>E-mail</label><input type="email" id="c_email" value="${escapeHtml(devis.client.email)}"></div>
      </div>
    </div>

    <div class="card">
      <h2>Détails du ${devis.type==='facture'?'facture':'devis'}</h2>
      <div class="row2">
        <div class="field"><label>Date</label><input type="date" id="d_date" value="${devis.dateCreation}"></div>
        <div class="field"><label>${devis.type==='facture'?"Échéance (jours)":"Validité (jours)"}</label><input type="number" id="d_validite" value="${devis.validiteJours}"></div>
      </div>
    </div>

    <div class="card">
      <h2>Prestations et fournitures</h2>
      <div id="lignesContainer"></div>
      <div class="actions-row">
        <button class="btn btn-ghost btn-sm" id="addFromLib">+ Depuis la bibliothèque</button>
        <button class="btn btn-ghost btn-sm" id="addFree">+ Ligne libre</button>
        <button class="btn btn-ghost btn-sm" id="addSection">+ Section (en-tête)</button>
      </div>
      <div class="row2" style="margin-top:12px;">
        <div class="field">
          <label>Remise globale (%)</label>
          <input type="number" id="d_remise" value="${devis.remisePct}">
        </div>
        ${devis.type!=='facture' ? `
        <div class="field">
          <label>Main d'œuvre (FCFA)</label>
          <input type="number" step="1" id="d_mainoeuvre" value="${devis.mainOeuvre||0}">
        </div>` : ''}
      </div>
      <div class="totals-box" id="totalsBox"></div>
    </div>

    <div class="card">
      <h2>Notes / conditions particulières</h2>
      <textarea id="d_notes" rows="3" placeholder="Ex : délai d'intervention, précisions sur les travaux...">${escapeHtml(devis.notes)}</textarea>
    </div>

    <div class="actions-row" style="margin-bottom:20px;">
      <button class="btn btn-primary" id="saveDevisBtn">Enregistrer</button>
      <button class="btn btn-amber" id="pdfDevisBtn">Aperçu / Imprimer PDF</button>
      <button class="btn btn-ghost" id="dupDevisBtn">Dupliquer</button>
      <button class="btn btn-danger" id="delDevisBtn">Supprimer</button>
      <button class="btn btn-ghost" id="backDevisBtn">Retour à la liste</button>
    </div>
  `;

  function renderLignes(){
    const c=document.getElementById('lignesContainer');
    if(devis.lignes.length===0){
      c.innerHTML = `<div class="helper" style="margin-bottom:8px;">Aucune ligne. Ajoutez une prestation ci-dessous.</div>`;
    } else {
      c.innerHTML = `
        <div class="table-scroll">
        <table class="lignes-table">
          <thead>
            <tr><th class="col-desig">Désignation</th><th class="col-num col-qte"><span class="long">Quantité</span><span class="court">Qté</span></th><th class="col-num col-pu"><span class="long">Prix unitaire</span><span class="court">P.U.</span></th><th class="col-num col-tot"><span class="long">Prix total</span><span class="court">Total</span></th><th class="col-rm"></th></tr>
          </thead>
          <tbody>
          ${devis.lignes.map((l,i)=>{
            if(l.type==='section'){
              return `
              <tr data-row="${i}" data-section="1">
                <td colspan="4" class="col-section" style="background:#F5F7FA;padding:8px;">
                  <input type="text" data-li="${i}" data-f="titre" value="${escapeHtml(l.titre||'')}" placeholder="Titre de la section (ex : Fillerie, Tubage, Appareillage...)" style="font-weight:700;text-transform:uppercase;letter-spacing:.03em;background:transparent;border:none;width:100%;padding:4px;">
                </td>
                <td class="col-rm">
                  <button class="insert-line" data-ins="${i}" title="Insérer une ligne ici">+</button>
                  <button class="remove-line" data-rm="${i}">&times;</button>
                </td>
              </tr>`;
            }
            return `
            <tr data-row="${i}">
              <td class="col-desig"><input type="text" class="desig-ligne" data-li="${i}" data-f="designation" placeholder="Désignation" value="${escapeHtml(l.designation)}" title="${escapeHtml(l.designation)}"></td>
              <td class="col-num col-qte" data-label="Qté"><input type="number" inputmode="decimal" step="0.01" data-li="${i}" data-f="qte" value="${l.qte}"></td>
              <td class="col-num col-pu" data-label="Prix unitaire"><input type="number" inputmode="numeric" step="1" data-li="${i}" data-f="prixUnitaire" value="${l.prixUnitaire}"></td>
              <td class="col-num col-tot total-cell" data-label="Total">${totalLigneHtml(l)}</td>
              <td class="col-rm">
                <button class="insert-line" data-ins="${i}" title="Insérer une ligne ici">+</button>
                <button class="remove-line" data-rm="${i}">&times;</button>
              </td>
            </tr>`;
          }).join('')}
          </tbody>
        </table>
        </div>`;
      c.querySelectorAll('input.desig-ligne').forEach(ta=>{
        // Entrée valide la saisie au lieu de créer un retour à la ligne dans la désignation
        ta.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); ta.blur(); } });
      });
      c.querySelectorAll('input[data-li]').forEach(inp=>{
        inp.addEventListener('input', ()=>{
          const i=parseInt(inp.dataset.li), f=inp.dataset.f;
          const v = inp.value;
          if(inp.classList.contains('desig-ligne')) inp.title = v;
          devis.lignes[i][f] = (f==='qte'||f==='prixUnitaire') ? (parseFloat(v)||0) : v;
          recalcRowTotals();
          renderTotals();
        });
      });
      c.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{
        devis.lignes.splice(parseInt(b.dataset.rm),1);
        renderLignes(); renderTotals();
      }));
      c.querySelectorAll('[data-ins]').forEach(b=>b.addEventListener('click',()=>{
        const pos = parseInt(b.dataset.ins)+1;
        devis.lignes.splice(pos, 0, {type:'ligne', designation:'', qte:1, prixUnitaire:0});
        renderLignes(); renderTotals();
        // Place le focus directement dans la désignation de la ligne insérée
        const newInput = document.querySelector(`[data-li="${pos}"][data-f="designation"]`);
        if(newInput) newInput.focus();
      }));
    }
  }

  function recalcRowTotals(){
    const c=document.getElementById('lignesContainer');
    c.querySelectorAll('tr[data-row]').forEach(row=>{
      if(row.dataset.section) return;
      const i=parseInt(row.dataset.row);
      const l=devis.lignes[i];
      const cell=row.querySelector('.total-cell');
      if(cell) cell.innerHTML = totalLigneHtml(l);
    });
  }

  function renderTotals(){
    devis.remisePct = parseFloat(document.getElementById('d_remise').value)||0;
    const moInput = document.getElementById('d_mainoeuvre');
    if(moInput) devis.mainOeuvre = parseFloat(moInput.value)||0;
    const t=computeTotals(devis);
    const box=document.getElementById('totalsBox');
    box.innerHTML = `
      <div class="t-row"><span>Sous-total</span><span>${fcfa(t.sousTotalBrut)}</span></div>
      ${devis.remisePct ? `<div class="t-row"><span>Remise (${devis.remisePct}%)</span><span>-${fcfa(t.remiseMontant)}</span></div>` : ''}
      ${devis.type!=='facture' ? `<div class="t-row"><span>Main d'œuvre</span><span>${fcfa(t.mainOeuvre)}</span></div>` : ''}
      <div class="t-row grand"><span>Totaux</span><span>${fcfa(t.total)}</span></div>
    `;
  }

  renderLignes(); renderTotals();

  const mainOeuvreInput = document.getElementById('d_mainoeuvre');
  if(mainOeuvreInput) mainOeuvreInput.addEventListener('input', renderTotals);

  document.getElementById('addFree').addEventListener('click', ()=>{
    devis.lignes.push({type:'ligne', designation:'', qte:1, prixUnitaire:0});
    renderLignes(); renderTotals();
  });

  document.getElementById('addSection').addEventListener('click', ()=>{
    devis.lignes.push({type:'section', titre:''});
    renderLignes(); renderTotals();
    // Place le focus directement dans le champ titre de la nouvelle section
    const inputs = document.querySelectorAll('#lignesContainer input[data-f="titre"]');
    const last = inputs[inputs.length-1];
    if(last) last.focus();
  });

  document.getElementById('addFromLib').addEventListener('click', ()=>{
    const mesArticles = articlesActifs();
    if(mesArticles.length===0){ alert("Votre bibliothèque d'articles est vide. Ajoutez-en depuis l'onglet Articles."); return; }
    const overlay=document.createElement('div');
    overlay.className='modal-overlay';
    const tries = [...mesArticles].sort((a,b)=>normaliser(a.designation).localeCompare(normaliser(b.designation)));
    overlay.innerHTML = `
      <div class="modal">
        <div class="modal-header"><h2>Choisir un article</h2><button class="close-x">&times;</button></div>
        ${champRecherche('rechLib', 'Rechercher un article…', '')}
        ${tries.map(a=>`
          <div class="list-item" data-pick="${a.id}" data-recherche="${escapeHtml(rechercheArticle(a))}" style="cursor:pointer;">
            <div><div class="name">${escapeHtml(a.designation)}</div><div class="meta">${fcfa(a.prixUnitaire)}</div></div>
            <button class="btn btn-amber btn-sm">Ajouter</button>
          </div>
        `).join('')}
        <div class="aucun-resultat" id="aucunLib">Aucun article ne correspond. Vous pouvez le saisir avec « + Ligne libre ».</div>
      </div>`;
    document.body.appendChild(overlay);
    brancherRecherche(overlay, 'rechLib', '.list-item[data-recherche]', 'aucunLib');
    overlay.querySelector('.close-x').addEventListener('click', ()=>overlay.remove());
    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
    overlay.querySelectorAll('[data-pick]').forEach(item=>{
      item.addEventListener('click', ()=>{
        const a=articles.find(x=>x.id===item.dataset.pick);
        devis.lignes.push({type:'ligne', designation:a.designation, qte:1, prixUnitaire:a.prixUnitaire});
        overlay.remove();
        renderLignes(); renderTotals();
      });
    });
  });

  document.getElementById('d_remise').addEventListener('input', ()=>{ renderTotals(); recalcRowTotals(); });

  function collectDevisFromForm(){
    devis.client.nom=val('c_nom'); devis.client.adresse=val('c_adresse');
    devis.client.cp=val('c_cp'); devis.client.ville=val('c_ville');
    devis.client.tel=val('c_tel'); devis.client.email=val('c_email');
    devis.dateCreation=document.getElementById('d_date').value || todayISO();
    devis.validiteJours=parseInt(document.getElementById('d_validite').value)||30;
    devis.notes=document.getElementById('d_notes').value;
    devis.statut=document.getElementById('d_statut').value;
    devis.remisePct=parseFloat(document.getElementById('d_remise').value)||0;
    const moEl = document.getElementById('d_mainoeuvre');
    devis.mainOeuvre = moEl ? (parseFloat(moEl.value)||0) : 0;
  }

  // Permet à saveSession() de récupérer le brouillon en cours à tout moment.
  window._editorGet = function(){
    try{ collectDevisFromForm(); }catch(e){ return null; }
    return { id: id || null, devis: JSON.parse(JSON.stringify(devis)) };
  };
  saveSession();

  document.getElementById('saveDevisBtn').addEventListener('click', ()=>{
    collectDevisFromForm();
    const exists = devisList.some(d=>d.id===devis.id);
    if(!exists){ devisList.push(devis); if(!id){ incrSeq(devis.type, devis.entrepriseId); } }
    else devisList = devisList.map(d=>d.id===devis.id?devis:d);
    save(KEY_DEV, devisList);
    showToast((devis.type==='facture'?'Facture':'Devis')+' enregistré(e)');
  });

  document.getElementById('pdfDevisBtn').addEventListener('click', ()=>{
    collectDevisFromForm();
    const exists = devisList.some(d=>d.id===devis.id);
    if(!exists){ devisList.push(devis); if(!id){ incrSeq(devis.type, devis.entrepriseId); } }
    else devisList = devisList.map(d=>d.id===devis.id?devis:d);
    save(KEY_DEV, devisList);
    printDevis(devis);
  });

  document.getElementById('dupDevisBtn').addEventListener('click', ()=>{
    collectDevisFromForm();
    const copy = JSON.parse(JSON.stringify(devis));
    copy.id=uid(); copy.numero=nextNumero(copy.type, copy.entrepriseId); incrSeq(copy.type, copy.entrepriseId);
    copy.dateCreation=todayISO(); copy.statut='brouillon';
    devisList.push(copy); save(KEY_DEV, devisList);
    showToast((copy.type==='facture'?'Facture':'Devis')+' dupliqué(e)');
    openDevisEditor(copy.id);
  });

  document.getElementById('delDevisBtn').addEventListener('click', ()=>{
    if(confirm(`Supprimer définitivement ce ${devis.type==='facture'?'facture':'devis'} ?`)){
      devisList = devisList.filter(d=>d.id!==devis.id);
      save(KEY_DEV, devisList);
      currentTab='devis'; render();
    }
  });

  document.getElementById('backDevisBtn').addEventListener('click', ()=>{ editingDevisId=null; currentTab='devis'; render(); });
}

/* ============================ IMPRESSION / PDF ============================ */
function printDevis(devis){
  const t=computeTotals(devis);
  const p=document.getElementById('printArea');
  const dateValidite = new Date(new Date(devis.dateCreation+'T00:00:00').getTime() + devis.validiteJours*86400000);
  // Bascule temporaire : imprime toujours avec l'entreprise sous laquelle CE document
  // a été créé, même si une autre entreprise est active depuis. Restaurée juste après.
  const entrepriseActivePrecedente = entreprise;
  entreprise = entrepriseForDevis(devis);
  appliquerTheme(entreprise.theme || 'navy');
  p.innerHTML = `
    <div class="doc-page">
      <div class="doc-header">
        <div>
          <img src="${currentLogo()}" class="logo-img"><br>
          <div class="ent-block">
            <div class="ent-name">${escapeHtml(entreprise.nom)||'Votre entreprise'}</div>
            ${escapeHtml(entreprise.adresse)}<br>
            ${escapeHtml(entreprise.cp)} ${escapeHtml(entreprise.ville)}<br>
            ${entreprise.tel?('Tél : '+escapeHtml(entreprise.tel)+'<br>'):''}
            ${entreprise.email?('E-mail : '+escapeHtml(entreprise.email)+'<br>'):''}
            ${entreprise.identifiantFiscal?('Id. fiscal : '+escapeHtml(entreprise.identifiantFiscal)+'<br>'):''}
            ${entreprise.rge?(escapeHtml(entreprise.rge)+'<br>'):''}
          </div>
        </div>
        <div class="doc-title">
          <h2>${devis.type==='facture'?'FACTURE':'DEVIS'}</h2>
          <div class="num">${devis.numero}</div>
          <div class="num">Date : ${frDate(devis.dateCreation)}</div>
          <div class="num">${devis.type==='facture'?'Échéance':'Validité'} : ${frDate(dateValidite.toISOString().slice(0,10))}</div>
        </div>
      </div>

      <div class="doc-meta">
        <div class="box">
          <h3>Client</h3>
          ${escapeHtml(devis.client.nom)}<br>
          ${escapeHtml(devis.client.adresse)}<br>
          ${escapeHtml(devis.client.cp)} ${escapeHtml(devis.client.ville)}<br>
          ${devis.client.tel?('Tél : '+escapeHtml(devis.client.tel)+'<br>'):''}
          ${devis.client.email?('E-mail : '+escapeHtml(devis.client.email)):''}
        </div>
      </div>

      <table class="doc-table">
        <thead><tr><th>Désignation</th><th>Quantité</th><th>Prix unitaire</th><th>Prix total</th></tr></thead>
        <tbody>
          ${devis.lignes.map(l=>{
            if(l.type==='section'){
              return `<tr><td colspan="4" style="background:#EAF1F8;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--navy);font-size:11px;padding:8px;">${escapeHtml(l.titre||'')}</td></tr>`;
            }
            return `
            <tr>
              <td>${escapeHtml(l.designation)}</td>
              <td>${l.qte}</td>
              <td>${fcfa(l.prixUnitaire)}</td>
              <td>${fcfa(l.qte*l.prixUnitaire)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>

      <div class="doc-totals">
        <table>
          <tr><td>Sous-total</td><td style="text-align:right;">${fcfa(t.sousTotalBrut)}</td></tr>
          ${devis.remisePct ? `<tr><td>Remise (${devis.remisePct}%)</td><td style="text-align:right;">-${fcfa(t.remiseMontant)}</td></tr>` : ''}
          ${devis.type!=='facture' ? `<tr><td>Main d'œuvre</td><td style="text-align:right;">${fcfa(t.mainOeuvre)}</td></tr>` : ''}
          <tr class="grand"><td>Totaux</td><td style="text-align:right;">${fcfa(t.total)}</td></tr>
        </table>
      </div>

      ${(devis.notes||entreprise.mentions) ? `<div class="doc-notes">${escapeHtml([devis.notes, entreprise.mentions].filter(Boolean).join('\n\n'))}</div>` : ''}

          ${(entreprise.tampon || entreprise.signature) ? `<div style="margin-top:8px;display:flex;gap:10px;align-items:flex-end;">
            ${entreprise.tampon ? `<img src="${entreprise.tampon}" style="width:4cm;height:4cm;object-fit:contain;">` : ''}
            ${entreprise.signature ? `<img src="${entreprise.signature}" style="max-height:50px;max-width:120px;object-fit:contain;">` : ''}

// Attend que toutes les images (logo, tampon, signature) soient réellement chargées
// dans la zone d'impression avant de lancer le PDF — évite qu'elles manquent à l'appel
// sur les appareils plus lents ou avec des images plus lourdes. Sécurité : n'attend
// jamais plus de 1,5 seconde, pour ne jamais bloquer l'impression indéfiniment.
function waitForImages(container){
  const imgs = Array.from(container.querySelectorAll('img'));
  if(imgs.length === 0) return Promise.resolve();
  const loaders = imgs.map(img=>{
    if(img.complete && img.naturalWidth > 0) return Promise.resolve();
    return new Promise(resolve=>{
      img.addEventListener('load', resolve, {once:true});
      img.addEventListener('error', resolve, {once:true});
    });
  });
  const timeout = new Promise(resolve=>setTimeout(resolve, 1500));
  return Promise.race([Promise.all(loaders), timeout]);
}

// ⚠️ URL de votre service de vérification de suspension (même serveur Render que FedaPay).
const REVOCATION_CHECK_URL = 'https://devispro.hasnemtech.com/api/check-revoked';

function checkRevocationSilently(license){
  if(!license || !license.deviceCode) return;
  try{
    const controller = new AbortController();
    const timeoutId = setTimeout(()=>controller.abort(), 4000);
    fetch(REVOCATION_CHECK_URL + '?deviceCode=' + encodeURIComponent(license.deviceCode), {signal: controller.signal})
      .then(res=> res.ok ? res.json() : null)
      .then(data=>{
        clearTimeout(timeoutId);
        if(data && data.revoked){
          const existingLock = document.getElementById('lockScreen');
          if(existingLock) existingLock.remove();
          const existingBanner = document.getElementById('trialBanner');
          if(existingBanner) existingBanner.remove();
          const nextRenewalIndex = (license.renewalIndex||0) + 1;
          showLockScreen(license, nextRenewalIndex, 'revoked', license.expiryDate, true);
        }
      })
      .catch(()=>{ /* pas d'internet ou serveur injoignable : on ignore silencieusement, l'app reste hors-ligne fonctionnelle */ });
  }catch(e){ /* fetch indisponible dans ce contexte : on ignore */ }
}

/* ============================ INITIALISATION ============================ */
(function initApp(){
  let license = load(KEY_LICENSE, null);
  if(!license){
    license = {deviceCode: generateDeviceCode(), activated:false, renewalIndex:0, activatedDate:'', expiryDate:'', key:'', planType:'', trialStart: isoToday()};
    save(KEY_LICENSE, license);
  }
  if(!license.deviceCode){ license.deviceCode = generateDeviceCode(); save(KEY_LICENSE, license); }
  if(!license.trialStart){ license.trialStart = isoToday(); save(KEY_LICENSE, license); }

  const today = isoToday();
  const paidValid = license.activated && license.expiryDate && today <= license.expiryDate;
  const trialEndISO = addDaysISO(license.trialStart, TRIAL_DAYS);
  const trialValid = !license.activated && today <= trialEndISO;

  if(paidValid){
    restaurerSession() || render();
  } else if(trialValid){
    restaurerSession() || render();
    showTrialBanner(license);
  } else {
    const nextRenewalIndex = (license.renewalIndex||0) + 1;
    const statusKind = license.activated ? 'license_expired' : 'trial_expired';
    showLockScreen(license, nextRenewalIndex, statusKind, license.expiryDate, true);
  }

  // Vérification de suspension : silencieuse, non bloquante, ignorée si pas d'internet.
  checkRevocationSilently(license);
})();
